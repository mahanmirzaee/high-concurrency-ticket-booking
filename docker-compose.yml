version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: booking_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 228568
      POSTGRES_DB: booking_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticket_net

  redis:
    image: redis:7-alpine
    container_name: booking_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - ticket_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket_api
    restart: always
    depends_on:
    - postgres
    - redis
    ports:
    - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:228568@postgres:5432/ticket_booking_db?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      JWT_SECRET: "super-secret-jwt-key-2026"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    networks:
      - ticket_net

networks:
  ticket_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local